name: Pipeline CI/CD FastAPI

on:
  push:
    branches: [develop, main]

# Variáveis globais: alterou aqui, vale para todos os jobs
env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-app
  CONTAINER_NAME: fastapi-app

jobs:
  # 1) BUILD: instala dependências, valida código e roda os testes
  build:
    name: Build e Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint com flake8
        run: flake8 . --max-line-length=100 --exclude=.git,__pycache__

      - name: Testes com pytest
        run: pytest -v

  # 2) IMAGEM: constrói e publica a imagem no Docker Hub
  imagem:
    name: Build e Push da Imagem
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
