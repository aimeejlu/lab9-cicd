name: Pipeline CI/CD FastAPI

on:
  push:
    branches: [develop, main]

# Variáveis globais: alterou aqui, vale para todos os jobs
env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-app
  CONTAINER_NAME: fastapi-app

jobs:
  # 1) BUILD: instala dependências, valida código e roda os testes
  build:
    name: Build e Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint com flake8
        run: flake8 . --max-line-length=100 --exclude=.git,__pycache__

      - name: Testes com pytest
        run: pytest -v

  # 2) IMAGEM: constrói e publica a imagem no Docker Hub
  imagem:
    name: Build e Push da Imagem
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

              # 3) DEPLOY HOMOLOGAÇÃO: só na develop, automático
  deploy-homologacao:
    name: Deploy Homologação
    runs-on: ubuntu-latest
    needs: imagem
    if: github.ref == 'refs/heads/develop'
    environment: homologacao
    steps:
      - name: Deploy na EC2 de homologação
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker rm -f ${{ env.CONTAINER_NAME }} || true
            docker run -d --name ${{ env.CONTAINER_NAME }} --restart unless-stopped -p 8080:8000 ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # 4) DEPLOY PRODUÇÃO: só na main, com aprovação manual
  deploy-producao:
    name: Deploy Produção
    runs-on: ubuntu-latest
    needs: imagem
    if: github.ref == 'refs/heads/main'
    environment: producao
    steps:
      - name: Deploy na EC2 de produção
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker rm -f ${{ env.CONTAINER_NAME }} || true
            docker run -d --name ${{ env.CONTAINER_NAME }} --restart unless-stopped -p 80:8000 ${{ env.IMAGE_NAME }}:${{ github.sha }}
